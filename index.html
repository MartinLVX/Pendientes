<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pendientes</title>
  <meta name="description" content="Tu lista de pendientes, en el celular y en la compu.">
  <meta name="theme-color" content="#f76707">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pendientes">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="marca">
        <img src="icons/icon.svg" alt="" width="36" height="36">
        <div>
          <h1>Pendientes</h1>
          <p id="resumen" class="resumen"></p>
        </div>
      </div>
      <button id="salir" class="link" hidden>Salir</button>
    </header>

    <!-- Pantalla de ingreso -->
    <section id="vista-login" hidden>
      <p class="intro">Ingresa con tu correo para ver tus pendientes en cualquier dispositivo.</p>
      <form id="form-login" class="card">
        <label>Correo
          <input type="email" id="email" autocomplete="email" required>
        </label>
        <label>Contraseña
          <input type="password" id="password" autocomplete="current-password" minlength="6" required>
        </label>
        <button type="submit" class="primary" id="btn-login">Entrar</button>
        <button type="button" class="link" id="btn-cambiar-modo">¿No tienes cuenta? Crear una</button>
        <p id="login-msg" class="msg" role="status"></p>
      </form>
    </section>

    <!-- Lista -->
    <section id="vista-lista" hidden>
      <form id="form-nuevo" class="nuevo card">
        <div class="nuevo-fila">
          <input id="nuevo-texto" type="text" placeholder="¿Qué tienes pendiente?" maxlength="500" autocomplete="off" enterkeyhint="done" required>
          <button type="submit" class="primary agregar" aria-label="Agregar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span>Agregar</span>
          </button>
        </div>
        <div class="urgencias" role="radiogroup" aria-label="Urgencia">
          <span class="urg-label">Urgencia</span>
          <label class="chip u1"><input type="radio" name="urgencia" value="1"><span>Baja</span></label>
          <label class="chip u2"><input type="radio" name="urgencia" value="2" checked><span>Media</span></label>
          <label class="chip u3"><input type="radio" name="urgencia" value="3"><span>Alta</span></label>
        </div>
      </form>

      <nav class="filtros" aria-label="Filtrar por urgencia">
        <button class="filtro activo" data-filtro="0">Todos <b id="n-0">0</b></button>
        <button class="filtro u3" data-filtro="3">Alta <b id="n-3">0</b></button>
        <button class="filtro u2" data-filtro="2">Media <b id="n-2">0</b></button>
        <button class="filtro u1" data-filtro="1">Baja <b id="n-1">0</b></button>
      </nav>

      <p id="estado" class="msg" role="status"></p>
      <ul id="lista" class="lista"></ul>
      <div id="vacio" class="vacio" hidden>
        <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20"/><path d="M15 25l6 6 12-13"/></svg>
        <p id="vacio-texto">No tienes pendientes. ¡Bien hecho!</p>
      </div>
      <details id="hechos-wrap" class="hechos" hidden>
        <summary>Hechos (<span id="hechos-n">0</span>)</summary>
        <ul id="lista-hechos" class="lista"></ul>
        <button id="borrar-hechos" class="link peligro">Borrar todos los hechos</button>
      </details>
    </section>
  </main>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
