<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pendientes</title>
  <meta name="description" content="Tu lista de pendientes, en el celular y en la compu.">
  <meta name="theme-color" content="#2f6b4f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pendientes">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Pendientes</h1>
      <button id="salir" class="link" hidden>Salir</button>
    </header>

    <!-- Pantalla de ingreso -->
    <section id="vista-login" hidden>
      <p class="intro">Ingresa con tu correo para ver tus pendientes en cualquier dispositivo.</p>
      <form id="form-login" class="card">
        <label>Correo
          <input type="email" id="email" autocomplete="email" required>
        </label>
        <label>Contraseña
          <input type="password" id="password" autocomplete="current-password" minlength="6" required>
        </label>
        <button type="submit" class="primary" id="btn-login">Entrar</button>
        <button type="button" class="link" id="btn-cambiar-modo">¿No tienes cuenta? Crear una</button>
        <p id="login-msg" class="msg" role="status"></p>
      </form>
    </section>

    <!-- Lista -->
    <section id="vista-lista" hidden>
      <form id="form-nuevo" class="nuevo">
        <input id="nuevo-texto" type="text" placeholder="Nuevo pendiente…" maxlength="500" autocomplete="off" enterkeyhint="done" required>
        <button type="submit" class="primary" aria-label="Agregar">Agregar</button>
      </form>
      <p id="estado" class="msg" role="status"></p>
      <ul id="lista" class="lista"></ul>
      <p id="vacio" class="vacio" hidden>No tienes pendientes. ¡Bien hecho!</p>
      <details id="hechos-wrap" class="hechos" hidden>
        <summary>Hechos (<span id="hechos-n">0</span>)</summary>
        <ul id="lista-hechos" class="lista"></ul>
        <button id="borrar-hechos" class="link peligro">Borrar todos los hechos</button>
      </details>
    </section>
  </main>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
